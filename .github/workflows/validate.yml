name: validate

on:
  push:
  pull_request:

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image test dependency
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Validate package contracts
        run: python3 scripts/validate_skills.py
      - name: Run package tests
        run: python3 -m unittest discover -s tests -v
      - name: Run facial report tests
        run: python3 -m unittest discover -s skills/facial-style-preview/tests -v
